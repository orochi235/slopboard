# yaml-language-server: $schema=./menubar.schema.json
#
# The wall's menu bar widget. `perch install` from this directory builds it and
# hands it to launchd; `perch run` puts it in the foreground to look at.
#
# It reports, it opens things, and it runs the wall. An action is a subprocess
# perch waits on, so it cannot hold a server open — `wall` hands the lifetime to
# launchd and returns, which is why these items are `run` and not a dev script.
# `wall` is on PATH because `wall install` links it into ~/.local/bin, which is
# already in the PATH this agent runs with.

app:
  name: slopboard
  id: tech.michaelbaker.slopboard.menubar
  icon: rectangle.stack
  interval: 5s
  sign: perch local signing

watch:
  # launchd's side of `wall stat`: whether the two agents are installed, loaded
  # and up. The daemon answering HTTP is a different question, and the gap
  # between the two is the state worth naming.
  daemon:
    launchagent: tech.michaelbaker.slopboard.daemon
  client:
    launchagent: tech.michaelbaker.slopboard.client
  # The paths come from the daemon rather than this file, which is what keeps
  # a home directory out of a committed config.
  wall:
    http: http://localhost:8787/api/health
    json: true
    shape:
      ok: bool
      items: int
      ttlMs: int
      inbox: string
      trash: string
  zones:
    http: http://localhost:8787/api/zones
    json: true
    shape:
      zones: [{zone: string, items: int, path: string}]

# Ordered, so each state excludes the ones above it: `wedged` is a daemon
# launchd has started that is not answering, which is the case `!wall.ok` alone
# used to report as "not running".
state:
  - uninstalled: "!daemon.installed"
  - stopped: "!daemon.loaded"
  - wedged: "!wall.ok"
  - up:

status:
  - when: "uninstalled || stopped || wedged"
    icon: exclamationmark.triangle
  - when: "wall.data.items == 0"
    dim: true
  - badge: "wall.data.items"

menu:
  - text: "{{wall.data.items}} on the wall"
    when: up
  - text: "daemon loaded, not answering"
    when: wedged
  - text: "daemon not loaded"
    when: stopped
  - text: "not installed — run wall install"
    when: uninstalled
  - text: "client not loaded"
    when: "!client.loaded && !uninstalled"
  - separator
  - text: Man the wall
    open: http://localhost:5183
  - separator
  - each: zones.data.zones
    when: "zones.ok"
    text: "{{it.zone}} — {{it.items}}"
    open: "{{it.path}}"
  - separator
  - text: Undo last expiry
    when: "wall.ok"
    post: {url: "http://localhost:8787/api/undo"}
  - text: Open the inbox
    when: "wall.ok"
    open: "{{wall.data.inbox}}"
  - text: Open the trash
    when: "wall.ok"
    open: "{{wall.data.trash}}"
  - separator
  # up, down and cycle each act on both agents, so they stay wall's job. The
  # daemon on its own gets the verb that boots out, waits and bootstraps —
  # which `wall cycle` cannot do, since kickstart needs the job already loaded.
  - text: Restart the daemon
    when: "!uninstalled"
    agent: daemon.restart
  - text: Cycle the wall
    when: "up || wedged"
    run: [wall, cycle]
  - text: Start the wall
    when: stopped
    run: [wall, up]
  - text: Stop the wall
    when: "up || wedged"
    run: [wall, down]
  - separator
  - {text: Quit, quit: true}
